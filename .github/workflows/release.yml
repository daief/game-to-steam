name: Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and upload Windows assets
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Read release version
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?(?<numeric>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?<prerelease>-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw 'Use a version tag such as v1.2.3 or v1.2.3-beta.1.'
          }
          $numeric = $Matches.numeric
          $version = $numeric + $Matches.prerelease
          foreach ($part in $numeric.Split('.')) {
            if ([long]$part -gt 65535) { throw 'Version components must not exceed 65535.' }
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: go test ./...

      - name: Check Go code
        run: go vet ./...

      - name: Check native UI
        run: go tool mygo vet

      - name: Set package version
        run: |
          $config = Get-Content -LiteralPath mygo.json -Raw | ConvertFrom-Json
          $config.version = $env:APP_VERSION
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath mygo.json -Encoding utf8NoBOM

      - name: Build application and NSIS setup with MyGo
        run: |
          go tool mygo build -platform windows/amd64
          if ($LASTEXITCODE -ne 0) { throw 'MyGo packaging failed.' }
          $setup = "build/windows-amd64/Game2Steam Setup $env:APP_VERSION amd64.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw 'MyGo did not produce the setup executable.' }
          foreach ($file in @('Game2Steam.exe', 'epic-bridge.exe')) {
            if (-not (Test-Path -LiteralPath "build/windows-amd64/$file")) { throw "Missing packaged file: $file" }
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $setup -Destination "dist/Game2Steam Setup $env:APP_VERSION amd64.exe"

      - name: Create portable archive and checksums
        run: |
          $archive = "dist/Game2Steam-$env:APP_VERSION-windows-amd64.zip"
          Compress-Archive -LiteralPath build/windows-amd64/Game2Steam.exe,build/windows-amd64/epic-bridge.exe -DestinationPath $archive
          $checksums = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            # GitHub normalizes spaces to periods in uploaded asset names.
            $assetName = $_.Name.Replace(' ', '.')
            "$hash  $assetName"
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG "dist/Game2Steam Setup $env:APP_VERSION amd64.exe" "dist/Game2Steam-$env:APP_VERSION-windows-amd64.zip" dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
